name: Direct download build (Stripe) + emulator test
# Direct-download build of this app (GitHub Releases / charleshartmann.com): same code, built with -Pstore=direct
# (Stripe Checkout instead of Google Play Billing, no Google Play links, no Play review prompt).
# Branch builds only make a DRAFT release; nothing is uploaded to any store.
on:
  push:
    branches: [direct-stripe]
  workflow_dispatch:
    inputs:
      steps:
        description: steps file under .github/direct (steps-release.txt or steps-restore.txt)
        default: steps-release.txt
permissions:
  contents: write
concurrency:
  group: direct-${{ github.ref }}
  cancel-in-progress: true
jobs:
  direct:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
    - name: Ensure Android SDK packages
      run: |
        echo "ANDROID_HOME=$ANDROID_HOME"
        SDKMANAGER=""
        for d in "$ANDROID_HOME/cmdline-tools/latest/bin" "$ANDROID_HOME"/cmdline-tools/*/bin; do
          if [ -x "$d/sdkmanager" ]; then SDKMANAGER="$d/sdkmanager"; break; fi
        done
        if [ -z "$SDKMANAGER" ]; then echo "sdkmanager not found under $ANDROID_HOME/cmdline-tools"; exit 1; fi
        "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
        yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses > /dev/null || true
    - name: Compute version code and version name
      run: |
        BASE_VERSION="1.0.0"
        NOW_UTC=$(date -u +'%y%j%H%M')
        WEAR_UTC=$((NOW_UTC + 1))
        VERSION_NAME="${BASE_VERSION}.$(date -u +'%Y%m%d.%H%M')"
        echo "ANDROID_VERSION_CODE=${NOW_UTC}" >> "$GITHUB_ENV"
        echo "ANDROID_WEAR_VERSION_CODE=${WEAR_UTC}" >> "$GITHUB_ENV"
        echo "ANDROID_VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_ENV"
        echo "Phone version code: $NOW_UTC"
        echo "Wear OS version code: $WEAR_UTC"
        echo "Version name: $VERSION_NAME"
    - name: Decode keystore
      run: |
        if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
          printf '%s' "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > tipsybuddy-release.jks
          echo "Decoded keystore from KEYSTORE_BASE64"
        else
          echo "ERROR: KEYSTORE_BASE64 secret is not set"
          exit 1
        fi
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "tipsybuddy.storeFile=tipsybuddy-release.jks" >> local.properties
        echo "tipsybuddy.storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
        echo "tipsybuddy.keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
        echo "tipsybuddy.keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Cache Gradle
      uses: actions/cache@v4
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-play-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
    - name: Build direct APK (store=direct)
      env:
        ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
        ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
      run: |
        set -o pipefail
        ./gradlew :app:assembleRelease -Pstore=direct --no-daemon --stacktrace 2>&1 | tee -a /tmp/dsk-build.log
        cd "$GITHUB_WORKSPACE"
        mkdir -p dsk-apk
        A=$(find . -path "*/build/outputs/apk/*release*/*.apk" ! -name "*unsigned*" | head -1); [ -z "$A" ] && A=$(find . -path "*/build/outputs/apk/*release*/*.apk" | head -1)
        cp "$A" dsk-apk/TipsyBuddy-direct-release.apk
        ls -la dsk-apk
        BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
        $BT/apksigner verify --print-certs dsk-apk/TipsyBuddy-direct-release.apk | head -3 || true
        $BT/aapt2 dump badging dsk-apk/TipsyBuddy-direct-release.apk | head -3 || true
        echo "--- Play Store URL strings left in the direct release dex:"; unzip -p dsk-apk/TipsyBuddy-direct-release.apk "classes*.dex" | strings | grep -E "play\.google\.com/store|market://" | head || true
    - name: Ship build log tail to the private drop (on failure)
      if: failure()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        tail -c 60000 /tmp/dsk-build.log 2>/dev/null | curl -s -m 60 -X PUT -H "X-Key: $DROP_KEY" --data-binary @- "https://hs-apk-drop.charles-h-hartmann1.workers.dev/c/dsklog_${{ github.event.repository.name }}_r${{ github.run_number }}/0" || true
    - name: Enable KVM
      run: |
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
    - name: Emulator test (phone, Google APIs, no Play Store)
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 30
        profile: pixel_5
        target: google_apis
        arch: x86_64
        ram-size: 3072M
        disk-size: 4096M
        emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        disable-animations: true
        script: STEPS_FILE=${{ github.event.inputs.steps || 'steps-release.txt' }} bash .github/direct/run-tests.sh
    - name: Upload test results to Tab's private drop
      if: always()
      env:
        DROP_KEY: ${{ secrets.DROP_KEY }}
      run: |
        bash .github/direct/direct-upload.sh /tmp/dsk-out dsk_TipsyBuddy_r${{ github.run_number }}
    - name: Draft release with the direct APK (not published)
      if: success()
      uses: softprops/action-gh-release@v2
      with:
        tag_name: direct-${{ github.run_number }}
        name: Direct build ${{ github.run_number }} (${{ github.sha }})
        draft: true
        files: dsk-apk/TipsyBuddy-direct-release.apk
