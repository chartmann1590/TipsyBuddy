name: Firebase Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@15

      - name: Authenticate with Google
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup gcloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Firebase Hosting
        run: |
          firebase deploy --only hosting --non-interactive --token "$(gcloud auth print-access-token)"

      - name: Deploy Firestore Rules
        run: |
          firebase deploy --only firestore:rules --non-interactive --token "$(gcloud auth print-access-token)"